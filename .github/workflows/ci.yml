name: CI — Node build & test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies (ci if lockfile present)
        run: |
          if [ -f package-lock.json ] || [ -f npm-shrinkwrap.json ]; then
            echo "Using npm ci"
            npm ci
          else
            echo "No lockfile, using npm install"
            npm install
          fi

      - name: Build (if any)
        run: |
          if npm run | grep -q " build"; then npm run build; else echo "No build script"; fi

      - name: Run tests (if any)
        run: |
          if npm run | grep -q " test"; then npm test || exit 1; else echo "No tests"; fi
