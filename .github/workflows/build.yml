name: Build and Test Project

# 1. Define when this workflow runs
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# 2. Define the execution environment and sequence
jobs:
  build-project:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Pull down the repository code into the runner
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # Step 2: Set up the programming language environment
      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Step 3: Clean install dependencies
      - name: Install Dependencies
        run: npm ci

      # Step 4: Run the build command
      - name: Build Application
        run: npm run build

      # Step 5: (Optional) Run tests to ensure the build isn't broken
      - name: Run Tests
        run: npm test
